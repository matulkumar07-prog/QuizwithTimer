<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>IUS - Registration Form for Students</title>
<style>
:root{--accent:#2563eb;--error:#dc2626;--muted:#6b7280;--bg:#f8fafc;--card:#ffffff;}
body{
  font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;
  background: linear-gradient(180deg, #eef2ff 0%, var(--bg) 100%);
  margin:0;
  padding:32px;
  display:flex;
  justify-content:center;
}
.container{
  width:100%;
  max-width:760px;
  background:var(--card);
  border-radius:12px;
  box-shadow:0 8px 30px rgba(2,6,23,0.08);
  padding:24px;
}
h1{margin:0 0 12px;font-size:20px}
p.lead{margin:0 0 18px;color:var(--muted)}
form{display:grid;gap:12px}
.row{display:flex;gap:12px}
.col{flex:1;min-width:0}
label{display:block;font-weight:600;margin-bottom:6px;font-size:13px}
input[type="text"],
input[type="email"],
input[type="password"],
input[type="tel"],
textarea,
select{
  width:100%;
  padding:10px 12px;
  border-radius:8px;
  border:1px solid #e6eef8;
  background:#fff;
  box-sizing:border-box;
  font-size:14px;
  outline: none;
}
textarea{min-height:80px;resize:vertical}
.small{font-size:12px;color:var(--muted)}
.gender, .branches{display:flex;gap:12px;align-items:center}
.error{color:var(--error);font-size:13px;margin-top:6px;display:none}
.show{display:block}
.actions{display:flex;gap:12px;align-items:center;justify-content:flex-end;margin-top:6px}
button{
  background:var(--accent);
  color:#fff;
  border:0;
  padding:10px 14px;
  border-radius:8px;
  font-weight:600;
  cursor:pointer;
}
button.secondary{background:#e6eef8;color:#0b1320}
.success{background:#ecfdf5;border:1px solid #34d399;color:#064e3b;padding:10px;border-radius:8px;display:none}
/* responsive */
@media (max-width:640px){ .row{flex-direction:column} .actions{flex-direction:column-reverse;align-items:stretch} }
</style>
</head>
<body>
<main class="container" role="main">
  <h1>Register My Bro !!</h1>
  <p class="lead">Fill the form and click <strong>Register</strong>. All validations are just a demo — made by Matul Kumar</p>

  <form id="studentForm" novalidate>
    <div class="row">
      <div class="col">
        <label for="enroll">Enroll Number</label>
        <input id="enroll" name="enroll" type="text" placeholder="e.g. 2025BCS001" required>
        <div class="error" id="err-enroll" aria-live="polite"></div>
      </div>
      <div class="col">
        <label for="name">Full Name</label>
        <input id="name" name="name" type="text" placeholder="Your full name" required>
        <div class="error" id="err-name" aria-live="polite"></div>
      </div>
    </div>

    <div class="row">
      <div class="col">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" required>
        <div class="error" id="err-email" aria-live="polite"></div>
      </div>
      <div class="col">
        <label for="phone">Phone number</label>
        <input id="phone" name="phone" type="tel" placeholder="10 digit phone number" required>
        <div class="error" id="err-phone" aria-live="polite"></div>
      </div>
    </div>

    <div class="row">
      <div class="col">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="At least 8 chars, include letter+number" required>
        <div class="error" id="err-password" aria-live="polite"></div>
      </div>
      <div class="col">
        <label for="confirmPassword">Confirm password</label>
        <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Repeat password" required>
        <div class="error" id="err-confirmPassword" aria-live="polite"></div>
      </div>
    </div>

    <div>
      <label for="address">Address</label>
      <textarea id="address" name="address" placeholder="Your address" required></textarea>
      <div class="error" id="err-address" aria-live="polite"></div>
    </div>

    <div>
      <label id="genderLabel">Gender</label>
      <div class="gender" role="radiogroup" aria-labelledby="genderLabel">
        <label><input type="radio" name="gender" value="male"> Male</label>
        <label><input type="radio" name="gender" value="female"> Female</label>
        <label><input type="radio" name="gender" value="other"> Other</label>
      </div>
      <div class="error" id="err-gender" aria-live="polite"></div>
    </div>

    <div>
      <label for="branch">Choose Branch</label>
      <select id="branch" name="branch" required>
        <option value="">-- select branch --</option>
        <option value="cse">CSE</option>
        <option value="ece">ECE</option>
        <option value="me">ME</option>
        <option value="ce">CE</option>
        <option value="ee">EE</option>
      </select>
      <div class="error" id="err-branch" aria-live="polite"></div>
    </div>

    <div class="actions">
      <div style="flex:1">
        <div id="success" class="success" role="status" aria-live="polite"></div>
      </div>
      <div style="display:flex;gap:8px">
        <button type="button" class="secondary" id="resetBtn">Reset</button>
        <button type="submit" id="submitBtn">Register</button>
      </div>
    </div>
  </form>
</main>

<script>
(function(){
  const form = document.getElementById('studentForm');
  const successBox = document.getElementById('success');
  const fields = {
    enroll: document.getElementById('enroll'),
    name: document.getElementById('name'),
    email: document.getElementById('email'),
    phone: document.getElementById('phone'),
    password: document.getElementById('password'),
    confirmPassword: document.getElementById('confirmPassword'),
    address: document.getElementById('address'),
    branch: document.getElementById('branch'),
  };

  function showError(id, message){
    const el = document.getElementById('err-' + id);
    if(!el) return;
    el.textContent = message;
    el.classList.add('show');
  }
  function clearError(id){
    const el = document.getElementById('err-' + id);
    if(!el) return;
    el.textContent = '';
    el.classList.remove('show');
  }

  function validateEnrollment(value){
    if(!value || !value.trim()) return 'Enter enrollment number';
    if(value.trim().length < 3) return 'Write full enrollment number';
    return '';
  }
  function validateName(value){
    if(!value || !value.trim()) return 'Full name is required.';
    if(value.trim().length < 3) return 'Enter a valid full name.';
    if(!/^[A-Za-z.'\-\s]+$/.test(value.trim())) return 'Name contains invalid characters.';
    return '';
  }
  function validateEmail(value){
    if(!value || !value.trim()) return 'Email is required.';
    const re = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
    if(!re.test(value.trim())) return 'Enter a valid email address.';
    return '';
  }
  function validatePhone(value){
    if(!value || !value.trim()) return 'Phone number is required.';
    const digits = value.replace(/\D/g,'');
    if(digits.length !== 10) return 'Phone number must be exactly 10 digits.';
    return '';
  }
  function validatePassword(value){
    if(!value) return 'Password is required.';
    if(value.length < 8) return 'Password must be at least 8 characters.';
    if(!/[A-Za-z]/.test(value) || !/[0-9]/.test(value)) return 'Password must include letters and numbers.';
    return '';
  }
  function validateConfirmPassword(password, confirm){
    if(!confirm) return 'Please confirm your password.';
    if(password !== confirm) return 'Passwords do not match.';
    return '';
  }
  function validateAddress(value){
    if(!value || !value.trim()) return 'Address is required.';
    if(value.trim().length < 10) return 'Please enter a more complete address (min 10 characters).';
    return '';
  }
  function validateGender(){
    const radios = form.querySelectorAll('input[name="gender"]');
    for(const r of radios){ if(r.checked) return ''; }
    return 'Please select your gender.';
  }
  function validateBranch(value){
    if(!value) return 'Please select a branch.';
    return '';
  }

  // Clear errors while typing / changing
  Object.keys(fields).forEach(key=>{
    const f = fields[key];
    if(f){
      f.addEventListener('input', () => clearError(key));
    }
  });
  const genderRadios = form.querySelectorAll('input[name="gender"]');
  genderRadios.forEach(r => r.addEventListener('change', ()=> clearError('gender')));
  if(fields.branch) fields.branch.addEventListener('change', ()=> clearError('branch'));

  // Reset button
  document.getElementById('resetBtn').addEventListener('click', ()=>{
    form.reset();
    successBox.style.display = 'none';
    // clear all errors
    ['enroll','name','email','phone','password','confirmPassword','address','gender','branch'].forEach(clearError);
  });

  // Submit handler
  form.addEventListener('submit', function(e){
    e.preventDefault(); // keep it client-side demo
    successBox.style.display = 'none';

    const values = {
      enroll: fields.enroll.value.trim(),
      name: fields.name.value.trim(),
      email: fields.email.value.trim(),
      phone: fields.phone.value.trim(),
      password: fields.password.value,
      confirmPassword: fields.confirmPassword.value,
      address: fields.address.value.trim(),
      branch: fields.branch.value,
    };

    // run validators
    const errors = {};
    errors.enroll = validateEnrollment(values.enroll);
    errors.name = validateName(values.name);
    errors.email = validateEmail(values.email);
    errors.phone = validatePhone(values.phone);
    errors.password = validatePassword(values.password);
    errors.confirmPassword = validateConfirmPassword(values.password, values.confirmPassword);
    errors.address = validateAddress(values.address);
    errors.gender = validateGender();
    errors.branch = validateBranch(values.branch);

    // clear previous errors
    ['enroll','name','email','phone','password','confirmPassword','address','gender','branch'].forEach(clearError);

    let hasError = false;
    for(const k in errors){
      if(errors[k]){
        showError(k, errors[k]);
        hasError = true;
      }
    }

    if(hasError){
      // focus first visible error
      const firstErr = form.querySelector('.error.show');
      if(firstErr){
        const id = firstErr.id.replace('err-','');
        const field = document.getElementById(id) || form.querySelector(`[name="${id}"]`);
        if(field) field.focus();
      }
      return;
    }

    // success path (client-side demo)
    successBox.textContent = 'Registration successful! (This is client-side demo — data not submitted to a server.)';
    successBox.style.display = 'block';

    const safeSummary = {
      enrollment: values.enroll,
      name: values.name,
      email: values.email,
      phone: values.phone.replace(/\D/g,''),
      branch: values.branch,
      gender: (function(){ const g = form.querySelector('input[name="gender"]:checked'); return g ? g.value : ''; })(),
      address: values.address
    };
    console.log('Student registration (client-only):', safeSummary);

    // clear password fields for security
    fields.password.value = '';
    fields.confirmPassword.value = '';
  });

})();
</script>
</body>
</html>
